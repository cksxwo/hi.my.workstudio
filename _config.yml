# hi my workstudio — Jekyll 설정
title: hi my workstudio
timezone: Asia/Seoul             # 날짜를 한국 시간 기준으로
future: true                      # 오늘 날짜로 쓴 글이 시간 차이 때문에 숨겨지지 않게
baseurl: "/hi.my.workstudio"     # 사이트 주소가 cksxwo.github.io/hi.my.workstudio 이므로
permalink: /archive/:title.html    # 글 주소: .../archive/글이름.html (끝에 / 를 붙이면 다른 페이지 주소가 바뀌니 주의)

# _posts 폴더의 글은 모두 글 페이지 모양(_layouts/post.html)으로 만들어짐
# 전시 글: _exhibition_posts 폴더의 전시마다 상세 페이지가 자동으로 만들어짐 (주소: .../exhibition/전시이름.html)
collections:
  exhibition_posts:
    output: true
    permalink: /exhibition/:name.html

defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
  - scope:
      path: ""
      type: exhibition_posts
    values:
      layout: exhibition_post   # _layouts/exhibition_post.html 틀을 사용

exclude:
  - README.md
