# Pages CMS 설정 — 폰/PC에서 Archive 글과 Exhibition 전시를 올리는 화면
media:
  input: images/archive            # 올린 사진이 저장되는 폴더
  output: /hi.my.workstudio/images/archive

content:
  - name: posts
    label: Archive
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: subtitle
        label: 소제목
        type: string
      - name: date
        label: 날짜
        type: date
        required: true
      - name: photos
        label: 사진 (최대 10장, 첫 번째 사진이 목록 썸네일이 돼요)
        type: image
        options:
          multiple:
            max: 10
      - name: body
        label: 본문
        type: rich-text

  - name: exhibition_posts
    label: Exhibition
    type: collection
    path: _exhibition_posts
    filename: "{year}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 전시 제목
        type: string
        required: true
      - name: date
        label: 전시 시작일 (정렬용)
        type: date
        required: true
      - name: period
        label: 전시 기간 (예 2026.03.01 – 03.20)
        type: string
      - name: venue
        label: 전시 장소 이름 (예 청파갤러리, 서울)
        type: string
      - name: address
        label: 전시 장소 주소 (예 서울 용산구 청파로47길 100 / 2 Rue Saint-Simon, 78000 Versailles)
        type: string
        required: true
      - name: photos
        label: 사진 (최대 10장, 첫 번째가 포스터, 나머지는 전시 전경)
        type: image
        options:
          multiple:
            max: 10
      - name: body
        label: 전시 서문
        type: rich-text
