  <style>
    /* ── 기본 설정 (style.css가 없어도 메인홈과 같은 모습이 되도록) ── */
    :root {
      --bg: #f3f5f6; --text: #1c1e20; --sub: #84898c; --placeholder: #e6e9eb;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font); font-weight: 300;
      background: var(--bg); color: var(--text);
      line-height: 1.7; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .page { max-width: 1100px; margin: 0 auto; padding-left: 5%; padding-right: 5%; padding-bottom: 120px; }
    /* 하단 문구: CV처럼 화면 맨 아래 가운데 */
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .page { flex: 1 0 auto; width: 100%; }
    .site-footer { padding: 36px 5%; font-size: .85rem; color: var(--sub); text-align: center; }

    /* ── 페이지가 부드럽게 나타남 ── */
    body { animation: pageIn .7s ease both; }
    @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
    button, a { -webkit-tap-highlight-color: transparent; }

    /* ── 두 줄 메뉴 버튼 (메인홈과 동일) ── */
    .menu-btn {
      position: fixed; z-index: 30;
      top: calc(24px + env(safe-area-inset-top, 0px)); left: 50%;
      width: 44px; height: 44px; transform: translateX(-50%);
      background: none; border: 0; cursor: pointer; color: var(--text);
    }
    .menu-btn:focus { outline: none; }
    /* 아래로 스크롤하면 메뉴 버튼이 사라지고, 위로 올리면 다시 나타남 */
    .menu-btn { transition: opacity .4s ease, transform .4s ease; }
    body.nav-hidden .menu-btn { opacity: 0; pointer-events: none; transform: translate(-50%, -14px); }
    .menu-btn span {
      position: absolute; left: 10px; width: 24px; height: 2px;
      background: currentColor;
      transition: transform .5s cubic-bezier(.65,0,.35,1), top .5s cubic-bezier(.65,0,.35,1);
    }
    .menu-btn span:nth-child(1) { top: 17px; }
    .menu-btn span:nth-child(2) { top: 25px; }
    body.menu-open .menu-btn span:nth-child(1) { top: 21px; transform: rotate(45deg); }
    body.menu-open .menu-btn span:nth-child(2) { top: 21px; transform: rotate(-45deg); }

    /* ── 카테고리 화면 (메인홈과 동일) ── */
    .menu {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      opacity: 0; visibility: hidden;
      transition: opacity .6s ease, visibility 0s linear .6s;
    }
    body.menu-open .menu { opacity: 1; visibility: visible; transition: opacity .6s ease; }
    body.menu-open { overflow: hidden; }
    .menu ul { list-style: none; text-align: center; margin-top: -6vh; }
    .menu li {
      opacity: 0; transform: translateY(14px);
      transition: opacity .5s ease, transform .6s cubic-bezier(.22,.61,.36,1);
    }
    body.menu-open .menu li { opacity: 1; transform: none; }
    body.menu-open .menu li:nth-child(1) { transition-delay: .12s; }
    body.menu-open .menu li:nth-child(2) { transition-delay: .2s; }
    body.menu-open .menu li:nth-child(3) { transition-delay: .28s; }
    body.menu-open .menu li:nth-child(4) { transition-delay: .36s; }
    .menu a {
      display: inline-block; padding: 9px 0;
      font-size: 1.3rem; font-weight: 300; letter-spacing: .08em;
      color: var(--sub); transition: color .3s;
    }
    .menu a:hover, .menu a:focus-visible, .menu a.active { color: var(--text); outline: none; }

    /* 페이지 이동 시 부드럽게 덮이는 막 */
    .veil {
      position: fixed; inset: 0; z-index: 40;
      background: var(--bg); opacity: 0; pointer-events: none;
      transition: opacity .7s ease;
    }
    body.navigating .veil { opacity: 1; pointer-events: auto; }

    /* ── 전시 지도 ── */
    .page { position: relative; padding-top: 0; padding-bottom: 0; }
    /* 제목은 첫 화면 위쪽에 고정, 지도는 각 화면 가운데 */
    .page-title {
      position: absolute; left: 0; right: 0; top: calc(92px + env(safe-area-inset-top, 0px)); margin: 0;
      text-align: center;
      font-size: 1.6rem; font-weight: 300; letter-spacing: .06em; line-height: 1.4;
    }
    /* 지도 하나가 한 화면을 차지하고, 그 가운데에 놓임 */
    .map-sec {
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 140px 0 70px;          /* 위쪽 메뉴·제목 자리를 비우고 남은 공간의 가운데 */
    }
    .map-title {
      text-align: center; margin-bottom: 18px;
      font-size: 1.1rem; font-weight: 300; letter-spacing: .1em; color: var(--sub);
    }
    /* 화면 높이에 맞춰 지도가 한 화면 안에 다 들어오도록 폭을 제한 */
    .map-wrap { position: relative; width: min(100%, 760px, calc(58svh * 1.125)); margin: 0 auto; }
    .map-wrap.france { width: min(100%, 600px, calc(58svh * 1.02)); }
    .map { display: block; width: 100%; height: auto; overflow: visible; }

    /* 지도: 테두리 선으로만 (서울 외곽선은 조금 진하게, 구 경계는 가늘게) */
    .gu { fill: none; stroke: #c3cacf; stroke-width: 1; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    /* 한강: 조금 두꺼운 선 하나 */
    .river { fill: none; stroke: #bcc3c8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .river.thin { stroke: #c3cacf; stroke-width: 1; }   /* 여의도 샛강: 구 경계와 같은 얇은 선 */
    .seoul { fill: none; stroke: #b2babf; stroke-width: 1.6; stroke-linejoin: round; vector-effect: non-scaling-stroke; }

    /* 은은하게 빛나는 흰 점 */
    .spot { cursor: pointer; outline: none; }
    .spot .halo { fill: url(#glow); animation: breathe 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    /* 흰 빛이 잘 보이도록: 점 아래에 아주 넓고 흐린 회색 그늘을 깔고, 그 위에 흰 빛을 겹침 (테두리 없음) */
    .spot .shade { fill: url(#shade); }
    .spot .core { fill: #fff; filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px #fff) drop-shadow(0 0 14px rgba(255,255,255,.9)); }
    .spot .hit { fill: transparent; }
    .spot:hover .core, .spot.on .core { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px #fff); }
    @keyframes breathe {
      0%, 100% { opacity: .35; transform: scale(.75); }
      50%      { opacity: 1;   transform: scale(1.15); }
    }

    /* 점을 누르면 포스터 이미지만 떠오름 */
    .pop {
      position: absolute; z-index: 5; width: 168px;
      opacity: 0; transform: translateY(6px); pointer-events: none;
      transition: opacity .35s ease, transform .35s ease;
    }
    .pop.on { opacity: 1; transform: none; pointer-events: auto; }
    .pop-img {
      position: relative; display: block; width: 100%;
      border: 0; padding: 0; background: var(--placeholder); cursor: pointer;
      box-shadow: 0 12px 30px rgba(40,48,54,.12);
    }
    .pop-img:focus { outline: none; }
    /* 내용이 없는 전시: 포스터만 보여주고 화살표·이동 없음 */
    .pop.no-link .pop-go { display: none; }
    .pop.no-link .pop-img { cursor: default; }
    .pop-img img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; }
    /* 이미지에 마우스를 올리거나 누르면 화살표가 나타남 */
    .pop-go {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      border: 0; padding: 0; cursor: pointer; color: #fff;
      background: rgba(30, 34, 38, .22);
      opacity: 0; pointer-events: none; transition: opacity .35s ease;   /* 처음 누르면 이미지가 받아서 화살표만 보여줌 */
    }
    .pop-go svg {
      width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.2;
      stroke-linecap: round; stroke-linejoin: round;
      transform: translateX(-4px); transition: transform .35s ease;
    }
    .pop.arrow .pop-go, .pop-go:focus-visible { opacity: 1; pointer-events: auto; outline: none; }
    .pop.arrow .pop-go svg { transform: none; }
    @media (hover: hover) {
      .pop-img:hover .pop-go { opacity: 1; pointer-events: auto; }
      .pop-img:hover .pop-go svg { transform: none; }
    }

    @media (max-width: 600px) {
      .menu a { font-size: 1.1rem; }
      .page { padding-left: 3%; padding-right: 3%; }
      .page-title { font-size: 1.3rem; top: calc(82px + env(safe-area-inset-top, 0px)); }
      .map-sec { padding: 120px 0 60px; }
      .map-title { font-size: 1rem; margin-bottom: 10px; }
        .pop { width: 132px; }
    }
  </style>
</head>

  /* ── 메뉴 열기/닫기 (메인홈과 동일) ── */
  var menuBtn = document.getElementById("menuBtn");
  var menu = document.getElementById("menu");
  function setMenu(open) {
    document.body.classList.toggle("menu-open", open);
    menuBtn.setAttribute("aria-expanded", open);
    menuBtn.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
    menu.setAttribute("aria-hidden", !open);
  }
  menuBtn.addEventListener("click", function () { setMenu(!document.body.classList.contains("menu-open")); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false); });

  /* 부드럽게 페이지 이동 */
  var leaving = false;
  function goTo(href) {
    if (leaving) return;
    leaving = true;
    document.body.classList.add("navigating");
    setTimeout(function () { location.href = href; }, 700);
  }
  Array.prototype.forEach.call(menu.querySelectorAll("a"), function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      if (a.classList.contains("active")) { setMenu(false); return; }   // 지금 페이지면 닫기만
      goTo(a.href);
    });
  });
  /* 스크롤 방향에 따라 메뉴 버튼 숨기기/보이기 */
  (function () {
    var lastY = window.scrollY, ticking = false;
    function onScroll() {
      var y = window.scrollY;
      if (document.body.classList.contains("menu-open")) { lastY = y; ticking = false; return; }
      if (y < 40) document.body.classList.remove("nav-hidden");            // 맨 위 근처에선 항상 보임
      else if (y > lastY + 4) document.body.classList.add("nav-hidden");    // 아래로 → 숨김
      else if (y < lastY - 4) document.body.classList.remove("nav-hidden"); // 위로 → 보임
      lastY = y; ticking = false;
    }
    window.addEventListener("scroll", function () {
      if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
    }, { passive: true });
  })();

  window.addEventListener("pageshow", function (e) {
    if (e.persisted) { leaving = false; document.body.classList.remove("navigating"); }

  function legacyPlace(p) {
    if (!p) return null;
    var m = p.match(/^서울 (.+)$/); if (m && SEOUL_GU[m[1]]) return ["seoul"].concat(SEOUL_GU[m[1]]);

  function fromAddress(addr) {
    if (!addr) return null;
    var a = String(addr);
    for (var gu in SEOUL_GU) if (a.indexOf(gu) !== -1) return ["seoul"].concat(SEOUL_GU[gu]);
    for (var i = 0; i < FRANCE_CITY.length; i++) if (FRANCE_CITY[i][0].test(a)) return ["france", FRANCE_CITY[i][1], FRANCE_CITY[i][2]];
    var zip = a.match(/\b(\d{2})\d{3}\b/);
    if (zip && FRANCE_DEPT[zip[1]]) return ["france"].concat(FRANCE_DEPT[zip[1]]);
    if (/서울|seoul/i.test(a)) return ["seoul", 126.978, 37.566];

  // 주소 글자로 정해지는 작은 흔들림: 같은 구·도시라도 주소가 다르면 자리가 조금 달라짐
  function jitter(str, map) {
    var h = 0; str = String(str || "");
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    var ang = (h % 360) * Math.PI / 180, r = ((h >>> 9) % 100) / 100;
    var k = map === "seoul" ? 0.009 : 0.25;
    return [Math.cos(ang) * r * k, Math.sin(ang) * r * k * 0.8];
  }

      Array.prototype.forEach.call(wrap.querySelectorAll(".spot"), function (g) {
        g.querySelector(".shade").setAttribute("r", (18 / sc).toFixed(2));  // 흰 빛을 돋보이게 하는 옅은 그늘
        g.querySelector(".core").setAttribute("r", (3.5 / sc).toFixed(2));  // 흰 점 지름 약 7px
        g.querySelector(".halo").setAttribute("r", (12 / sc).toFixed(2));   // 빛 번짐
        g.querySelector(".hit").setAttribute("r", (20 / sc).toFixed(2));    // 손가락으로 누르기 쉬운 범위
      });
    });
  }
  sizeDots();
  window.addEventListener("resize", function () { sizeDots(); if (current) place(current); });

  // 포스터 카드 위치: 점 위쪽에, 공간이 없으면 아래쪽에. 지도 밖으로 나가지 않게
  function place(ex) {
    var rect = ex.wrap.getBoundingClientRect();
    var sc = rect.width / ex.M.vb[2];
    var x = (ex.x - ex.M.vb[0]) * sc, y = (ex.y - ex.M.vb[1]) * sc;
    var pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 18;
    var left = Math.min(Math.max(x - pw / 2, 0), rect.width - pw);
    var top = y - ph - gap;
    if (top < 0) top = y + gap;
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function show(ex) {
    if (current === ex && pop.classList.contains("on")) { hide(); return; }
    if (current) current.el.classList.remove("on");
    current = ex;
    ex.el.classList.add("on");
    if (pop.parentNode !== ex.wrap) { pop.classList.remove("on"); ex.wrap.appendChild(pop); void pop.offsetWidth; }
    document.getElementById("popImg").src = ex.poster;
    document.getElementById("popImg").alt = ex.title + " 포스터";
    document.getElementById("popGo").setAttribute("aria-label", ex.title + " 전시 페이지로 이동");
    pop.classList.remove("arrow");
    pop.classList.toggle("no-link", !ex.href);
    pop.classList.add("on");
    pop.setAttribute("aria-hidden", "false");
    place(ex);
  }
  function hide() {
    pop.classList.remove("on", "arrow");
    pop.setAttribute("aria-hidden", "true");
    if (current) current.el.classList.remove("on");
    current = null;
  }
  document.getElementById("popGo").addEventListener("click", function (e) {
    e.stopPropagation();
    if (current && current.href) goTo(current.href);
  });
  // 이미지를 누르면 화살표가 나타나고, 화살표를 누르면 이동
  pop.addEventListener("click", function (e) { e.stopPropagation(); });
  document.getElementById("popImg").addEventListener("click", function () { if (current && current.href) pop.classList.add("arrow"); });
  document.addEventListener("click", hide);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hide(); });
</script>
</body>
</html>
