<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hi my workstudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;display=swap">
<style>
  :root {
    --bg: #f3f5f6;
    --text: #1c1e20;
    --sub: #84898c;
    --font: "Cormorant Garamond", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", serif;
    box-sizing: border-box;
  }
  html { height: 100%; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body.reset * { transition: none !important; }
  a { color: inherit; text-decoration: none; }

  /* 메뉴: 이미지 위에서도 보이도록 항상 맨 위 */
  .site-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: flex-end;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 5% 28px;
  }
  .site-nav {
    display: flex; gap: 32px; list-style: none;
    font-size: 1.1rem; font-weight: 400;
    opacity: 0; transition: opacity 1.6s ease;
  }
  .site-nav a {
    color: var(--sub); padding-bottom: 2px; border-bottom: 1px solid transparent;
    transition: color 1.6s ease, border-color .3s;
  }
  .site-nav a:hover { color: var(--text); border-bottom-color: var(--text); }
  body.ready .site-nav { opacity: 1; }
  body.shown .site-nav a { color: rgba(255,255,255,.92); text-shadow: 0 0 14px rgba(0,0,0,.28); }
  body.shown .site-nav a:hover { color: #fff; border-bottom-color: #fff; }

  /* 글 */
  .home {
    position: absolute; inset: 0; z-index: 2;
    display: flex; justify-content: center; align-items: center;
    text-align: center; padding: 0 5% 90px;
    pointer-events: none;
  }
  .stage { transition: opacity 1.6s ease; }
  body.leave .stage { opacity: 0; }
  .home h1 {
    font-size: clamp(2.4rem, 7vw, 4.8rem);
    font-weight: 400; line-height: 1.2; letter-spacing: 0.01em;
    margin-bottom: 20px;
  }
  .ch { display: inline-block; opacity: 0; will-change: transform, opacity; }
  .sp { display: inline-block; width: .28em; }
  .home p { color: var(--sub); font-size: 1.1rem; opacity: 0; transition: opacity 1.6s ease; }
  body.ready .home p { opacity: 1; }

  /* 대표 작품 이미지: 화면 꽉 채우기 (지금은 자리표시) */
  .art {
    position: fixed; inset: 0; z-index: 1;
    overflow: hidden;
    opacity: 0;
    transition: opacity 2.8s ease;
    pointer-events: none;
  }
  .art-media {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #d9dfe3, #9fabb2);
    color: rgba(255,255,255,.85); font-size: 1rem;
    filter: blur(12px); transform: scale(1.06);
    transition: filter 2.8s ease, transform 3.8s cubic-bezier(.22,.61,.36,1);
  }
  .art-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  body.shown .art { opacity: 1; }
  body.shown .art-media { filter: none; transform: none; }

  #replay {
    position: fixed; left: 50%; z-index: 4;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    font: inherit; font-size: .95rem; color: var(--sub);
    background: none; border: 0; border-bottom: 1px solid transparent;
    cursor: pointer; padding: 4px 2px;
    transition: color 1.6s ease;
  }
  body.shown #replay { color: rgba(255,255,255,.9); text-shadow: 0 0 14px rgba(0,0,0,.28); }
  #replay:hover, #replay:focus-visible { border-bottom-color: currentColor; outline: none; }

  @media (prefers-reduced-motion: reduce) {
    .ch { opacity: 1; }
    .site-nav, .home p, .stage, .art, .art-media { transition: none; }
  }
</style>
</head>
<body>

  <header class="site-header">
    <ul class="site-nav">
      <li><a href="#">CV</a></li>
      <li><a href="#">Artwork</a></li>
      <li><a href="#">Exhibition</a></li>
    </ul>
  </header>

  <main class="home">
    <div class="stage">
      <h1 id="title" aria-label="hi my workstudio"></h1>
      <p>chaneun woo</p>
    </div>
  </main>

  <div class="art" role="img" aria-label="대표 작품 이미지 자리">
    <div class="art-media">대표 작품 이미지 자리</div>
  </div>

  <button id="replay" type="button">replay</button>

<script>
  var TEXT = "hi my workstudio";
  var title = document.getElementById("title");
  var timer, timer2, timer3, raf;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function play() {
    clearTimeout(timer); clearTimeout(timer2); clearTimeout(timer3);
    cancelAnimationFrame(raf);
    document.body.classList.add("reset");
    document.body.classList.remove("ready", "leave", "shown");
    void document.body.offsetWidth;
    document.body.classList.remove("reset");
    title.innerHTML = "";

    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var h = window.innerHeight;
    var letters = [];
    var end = 0;

    TEXT.split("").forEach(function (c) {
      var s = document.createElement("span");
      s.setAttribute("aria-hidden", "true");
      if (c === " ") { s.className = "sp"; title.appendChild(s); return; }
      s.className = "ch";
      s.textContent = c;
      title.appendChild(s);
      var L = {
        el: s,
        x0: rand(-160, 160),
        y0: -(h * rand(.58, .85) + 60),
        r0: rand(-160, 160),
        amp: rand(18, 46),
        cyc: rand(1.4, 2.6),
        ph: rand(0, 6.28),
        ph2: rand(0, 6.28),
        delay: rand(0, 1.8) * 1000,
        dur: rand(4, 5.6) * 1000
      };
      end = Math.max(end, L.delay + L.dur);
      letters.push(L);
    });

    if (reduce) {
      letters.forEach(function (L) { L.el.style.opacity = 1; });
      document.body.classList.add("ready", "leave", "shown");
      return;
    }

    var t0 = performance.now();
    function frame(now) {
      var t = now - t0, done = true;
      letters.forEach(function (L) {
        var p = Math.min(Math.max((t - L.delay) / L.dur, 0), 1);
        if (p < 1) done = false;
        var e = 1 - Math.pow(1 - p, 2);   /* 한 번도 멈추지 않고 서서히 느려지는 낙하 */
        var d = Math.pow(1 - p, 1.5);     /* 도착할수록 잦아드는 흔들림 */
        var x = L.x0 * (1 - e) + L.amp * Math.sin(L.ph + p * L.cyc * 6.283) * d;
        var y = L.y0 * (1 - e);
        var r = L.r0 * (1 - e) + 14 * Math.sin(L.ph2 + p * 6.283 * 1.3) * d;
        L.el.style.transform = "translate(" + x + "px," + y + "px) rotate(" + r + "deg)";
        /* 처음엔 연하게, 자리에 가까워질수록 진하게 */
        L.el.style.opacity = p === 0 ? 0 : 1 - 0.88 * Math.pow(1 - e, 1.2);
      });
      if (!done) { raf = requestAnimationFrame(frame); }
      else { letters.forEach(function (L) { L.el.style.transform = "none"; L.el.style.opacity = 1; }); }
    }
    raf = requestAnimationFrame(frame);

    /* 1) 글자가 정리되면 소개와 메뉴  2) 잠시 머문 뒤 문구가 사라지고  3) 대표 이미지가 화면을 채우며 나타남 */
    timer  = setTimeout(function () { document.body.classList.add("ready"); }, Math.max(end - 300, 0));
    timer2 = setTimeout(function () { document.body.classList.add("leave"); }, end + 1500);
    timer3 = setTimeout(function () { document.body.classList.add("shown"); }, end + 2100);
  }

  document.getElementById("replay").addEventListener("click", play);
  play();
</script>
</body>
</html>
